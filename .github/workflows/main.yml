name: Build

on:
  pull_request:
  push:
    paths:
      - .github/workflows/main.yml
      - .dockerignore
      - Dockerfile.build
      - pyproject.toml
      - uv.lock
      - transcriber/**
      - captions/**
      - server/**

jobs:
  test:
    strategy:
      matrix:
        working-directory: [server, transcriber, captions]
    uses: winstxnhdw/actions/.github/workflows/uv.yml@4bc6679dff95ade0d7b54199996217bb52a826a9 # main
    with:
      working-directory: ${{ matrix.working-directory }}

  build:
    uses: winstxnhdw/actions/.github/workflows/docker-build.yml@4bc6679dff95ade0d7b54199996217bb52a826a9 # main
    with:
      file: Dockerfile.build

  push:
    if: github.ref == 'refs/heads/main'
    needs: [test, build]
    uses: winstxnhdw/actions/.github/workflows/docker-push.yml@4bc6679dff95ade0d7b54199996217bb52a826a9 # main
    with:
      file: Dockerfile.build
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write

  restart:
    if: github.ref == 'refs/heads/main'
    needs: push
    uses: winstxnhdw/actions/.github/workflows/spaces-restart.yml@4bc6679dff95ade0d7b54199996217bb52a826a9 # main
    secrets:
      token: ${{ secrets.HF_TOKEN }}
